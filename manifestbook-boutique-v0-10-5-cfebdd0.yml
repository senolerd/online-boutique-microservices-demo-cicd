
---
apiVersion: v1
kind: Namespace
metadata:
    name: boutique-v0-10-5 

---
apiVersion: v1
kind: Service
metadata:
    name: redis-cart
    namespace: boutique-v0-10-5
spec:
    selector:
        app: redis-cart
    ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

--- 
apiVersion: apps/v1
kind: Deployment
metadata:
    name: redis-cart
    namespace: boutique-v0-10-5
    labels:
        app: redis-cart
spec:
    replicas: 1
    selector:
        matchLabels:
            app: redis-cart
    template:
        metadata:
            labels:
                app: redis-cart
        spec:
            containers:
            - name: redis-cart
              image: redis
              imagePullPolicy: Always
              ports:
              - containerPort: 6379

--- 
apiVersion: apps/v1
kind: Deployment
metadata:
    name: cartservice
    namespace: boutique-v0-10-5
    labels:
        app: cartservice
spec:
    replicas: 1
    selector:
        matchLabels:
            app: cartservice
    template:
        metadata:
            labels:
                app: cartservice
        spec:
            containers:
            - name: cartservice
              image: docker.io/alkol/cartservice-v0.10.5:cfebdd0
              imagePullPolicy: Always
              ports:
              - containerPort: 7070

---
apiVersion: v1
kind: Service
metadata:
    name: cartservice
    namespace: boutique-v0-10-5
spec:
    selector:
        app: cartservice
    ports:
    - protocol: TCP
      port: 7070
      targetPort: 7070
