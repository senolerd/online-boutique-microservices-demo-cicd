
---
apiVersion: v1
kind: Namespace
metadata:
    name: boutique-v0-10-5 

--- 
apiVersion: apps/v1
kind: Deployment
metadata:
    name: cartservice
    namespace: boutique-v0-10-5
    labels:
        app: cartservice
spec:
    replicas: 1
    selector:
        matchLabels:
            app: cartservice
    template:
        metadata:
            labels:
                app: cartservice
        spec:
            containers:
            - name: cartservice
              image: docker.io/alkol/cartservice-v0.10.5:d3e5248
              imagePullPolicy: Always
              ports:
              - containerPort: 7070

---
apiVersion: v1
kind: Service
metadata:
    name: cartservice
    namespace: boutique-v0-10-5
spec:
    selector:
        app: cartservice
    ports:
    - protocol: TCP
      port: 7070
      targetPort: 7070

--- 
apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend
    namespace: boutique-v0-10-5
    labels:
        app: frontend
spec:
    replicas: 1
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            containers:
            - name: frontend
              image: docker.io/alkol/frontend-v0.10.5:d3e5248
              imagePullPolicy: Always
              ports:
              - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
    name: frontend
    namespace: boutique-v0-10-5
spec:
    selector:
        app: frontend
    ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
