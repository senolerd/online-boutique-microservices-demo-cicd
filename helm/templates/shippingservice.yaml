
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ .Values.shippingservice.name }}
    namespace: {{ .Values.namespace }} 
    labels:
        app: {{ .Values.shippingservice.name }}
spec:
    replicas: 1
    selector:
        matchLabels:
            app: {{ .Values.shippingservice.name }}
    template:
        metadata:
            labels:
                app: {{ .Values.shippingservice.name }}
        spec:
            containers:
            - name: {{ .Values.shippingservice.name }}
              image: {{ .Values.shippingservice.image }}
              imagePullPolicy: Always
              ports:
              - containerPort: {{ .Values.shippingservice.port }}
              envFrom:
              - configMapRef:
                  name: common-env-vars
---
apiVersion: v1
kind: Service
metadata:
    name: {{ .Values.shippingservice.name }}
    namespace: {{ .Values.namespace }} 
spec:
    selector:
        app:  {{ .Values.shippingservice.name }}
    ports:
    - protocol: TCP
      port:  {{ .Values.shippingservice.port }}
      targetPort:  {{ .Values.shippingservice.port }} 
